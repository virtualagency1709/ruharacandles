<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldHGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB35F" />
      <stop offset="50%" stop-color="#C9973F" />
      <stop offset="100%" stop-color="#8B5A2B" />
    </linearGradient>
  </defs>

  <!-- Circular Badge on the Left (Mini) -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="31" fill="#F5EBDD" stroke="url(#goldHGrad)" stroke-width="2" />
    <circle cx="32" cy="32" r="28" fill="none" stroke="#C9973F" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />
    
    <!-- Arch -->
    <path d="M 22 43 L 22 26 A 10 10 0 0 1 42 26 L 42 43 Z" fill="none" stroke="url(#goldHGrad)" stroke-width="1.4" />
    
    <!-- Leaves -->
    <path d="M 28 35 Q 26 28 24 23" fill="none" stroke="#7A8B6A" stroke-width="1.2" stroke-linecap="round" />
    <ellipse cx="25" cy="24" rx="2.5" ry="1.5" transform="rotate(-30 25 24)" fill="#7A8B6A" />

    <!-- Candle & Flame -->
    <rect x="33" y="32" width="6" height="10" rx="1" fill="#8B5A2B" />
    <path d="M 36 24 C 34 27, 34 29, 36 30 C 38 29, 38 27, 36 24 Z" fill="url(#goldHGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(86, 0)">
    <text x="0" y="38" 
          font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="3" 
          fill="#4A2E15">
      RUHARA
    </text>

    <!-- Gold Accent Line -->
    <line x1="0" y1="47" x2="160" y2="47" stroke="url(#goldHGrad)" stroke-width="1.2" stroke-linecap="round" />
    <polygon points="163,47 167,45 167,49" fill="#C9973F" />

    <!-- Subtitle -->
    <text x="1" y="62" 
          font-family="'Poppins', 'Inter', sans-serif" 
          font-size="9" 
          font-weight="600" 
          letter-spacing="2.8" 
          fill="#8B5A2B">
      CANDLES &amp; HOME DECOR
    </text>
  </g>
</svg>
