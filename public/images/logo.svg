<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB35F" />
      <stop offset="50%" stop-color="#C9973F" />
      <stop offset="100%" stop-color="#8B5A2B" />
    </linearGradient>

    <!-- Warm Cream Radial Gradient -->
    <radialGradient id="creamBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FAF4EB" />
      <stop offset="85%" stop-color="#F5EBDD" />
      <stop offset="100%" stop-color="#ECE0CE" />
    </radialGradient>

    <!-- Soft Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4A2E15" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Outer Circular Gold Ring -->
  <circle cx="250" cy="250" r="236" fill="url(#creamBg)" stroke="url(#goldGradient)" stroke-width="4.5" filter="url(#softShadow)" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="#C9973F" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.8" />

  <!-- Decorative Inner Arch (Mihrab Shape) -->
  <path d="M 160 300 
           L 160 190 
           A 90 90 0 0 1 340 190 
           L 340 300 
           Z" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="2.5" 
        stroke-linecap="round" />

  <!-- Inner Delicate Arch Border -->
  <path d="M 172 300 
           L 172 195 
           A 78 78 0 0 1 328 195 
           L 328 300" 
        fill="none" 
        stroke="#8B5A2B" 
        stroke-width="1" 
        stroke-opacity="0.35" />

  <!-- Botanical Leaves / Vase Motif (Left & Center) -->
  <!-- Vase -->
  <path d="M 205 290 
           C 200 270, 195 245, 215 240 
           C 220 238, 222 232, 222 228
           L 228 228
           C 228 232, 230 238, 235 240
           C 255 245, 250 270, 245 290
           Z" 
        fill="#8B5A2B" 
        opacity="0.9" />

  <!-- Olive / Botanical Branches arching upward -->
  <path d="M 225 228 Q 215 190 200 170" fill="none" stroke="#7A8B6A" stroke-width="2" stroke-linecap="round" />
  <ellipse cx="205" cy="180" rx="6" ry="3" transform="rotate(-35 205 180)" fill="#7A8B6A" />
  <ellipse cx="218" cy="195" rx="6" ry="3.2" transform="rotate(-50 218 195)" fill="#7A8B6A" />
  <ellipse cx="200" cy="168" rx="5.5" ry="3" transform="rotate(-20 200 168)" fill="#7A8B6A" />

  <!-- Candle Vessel with Flame (Right Side of Mihrab) -->
  <!-- Candle Jar -->
  <rect x="260" y="248" width="45" height="42" rx="4" fill="none" stroke="#8B5A2B" stroke-width="2.5" />
  <rect x="264" y="254" width="37" height="32" rx="2" fill="#ECE0CE" opacity="0.7" />
  
  <!-- Candle Wick -->
  <line x1="282.5" y1="248" x2="282.5" y2="236" stroke="#4A2E15" stroke-width="2" stroke-linecap="round" />

  <!-- Candle Flame -->
  <path d="M 282.5 212 
           C 275 224, 274 233, 282.5 236 
           C 291 233, 290 224, 282.5 212 Z" 
        fill="url(#goldGradient)" />
  <circle cx="282.5" cy="229" r="2.8" fill="#FFF9E6" />

  <!-- Flame Glow Aura -->
  <circle cx="282.5" cy="226" r="16" fill="#DFB35F" opacity="0.18" />

  <!-- Arch Base Line / Shelf -->
  <line x1="145" y1="300" x2="355" y2="300" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />
  <line x1="175" y1="305" x2="325" y2="305" stroke="#8B5A2B" stroke-width="1" opacity="0.4" />

  <!-- Brand Typography -->
  <!-- "RUHARA" Wordmark -->
  <text x="250" y="362" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" 
        font-size="44" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#4A2E15">
    RUHARA
  </text>

  <!-- Thin Gold Ornamental Divider -->
  <line x1="185" y1="382" x2="315" y2="382" stroke="url(#goldGradient)" stroke-width="1.2" stroke-linecap="round" />
  <polygon points="250,379.5 253,382 250,384.5 247,382" fill="#C9973F" />

  <!-- Subtitle: "CANDLES & HOME DECOR" -->
  <text x="250" y="405" 
        text-anchor="middle" 
        font-family="'Poppins', 'Inter', sans-serif" 
        font-size="12.5" 
        font-weight="500" 
        letter-spacing="3.5" 
        fill="#8B5A2B">
    CANDLES &amp; HOME DECOR
  </text>

  <!-- Tagline: "Light up your space with love" -->
  <text x="250" y="426" 
        text-anchor="middle" 
        font-family="'Playfair Display', Georgia, serif" 
        font-style="italic" 
        font-size="11.5" 
        letter-spacing="1" 
        fill="#7A8B6A">
    Light up your space with love
  </text>
</svg>
