<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad_16" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#ECE3D4"/>
    </linearGradient>
    <linearGradient id="goldGrad_16" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8A94A"/>
      <stop offset="50%" stop-color="#C9973F"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
    <filter id="cardShadow_16" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3B2412" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Clean Warm Cream Background -->
  <rect width="600" height="750" rx="16" fill="url(#bgGrad_16)"/>

  <!-- Minimal Hairline Border -->
  <rect x="18" y="18" width="564" height="714" rx="12" fill="none" stroke="url(#goldGrad_16)" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="24" y="24" width="552" height="702" rx="8" fill="none" stroke="#D8A94A" stroke-width="0.7" stroke-opacity="0.2" stroke-dasharray="3,3"/>

  <!-- Architectural Arch Motif Outline -->
  <path d="M 210,105 A 90,90 0 0,1 390,105 L 390,260 L 210,260 Z" fill="#FFFFFF" fill-opacity="0.45" stroke="url(#goldGrad_16)" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Minimal Line Art Candle & Flame -->
  <circle cx="300" cy="150" r="45" fill="#FFEAA7" fill-opacity="0.25"/>
  <path d="M 300,128 C 304,140 307,146 304,154 C 301,159 298,159 296,154 C 293,146 296,140 300,128 Z" fill="#D8A94A"/>
  <circle cx="300" cy="150" r="2.5" fill="#FAF6F0"/>
  <line x1="300" y1="154" x2="300" y2="164" stroke="#4A2E15" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Candle Vessel Line Art -->
  <rect x="260" y="164" width="80" height="75" rx="8" fill="#FFFFFF" stroke="url(#goldGrad_16)" stroke-width="1.2" filter="url(#cardShadow_16)"/>
  <line x1="260" y1="174" x2="340" y2="174" stroke="#D8A94A" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="300" cy="201" r="14" fill="none" stroke="#D8A94A" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Brand Typography -->
  <text x="300" y="305" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11.5" font-weight="700" fill="#8B5A2B" letter-spacing="4" text-anchor="middle">RUHARA CANDLES</text>

  <!-- Divider -->
  <line x1="230" y1="322" x2="370" y2="322" stroke="#D8A94A" stroke-width="0.8" stroke-opacity="0.45"/>
  <circle cx="300" cy="322" r="2.5" fill="#C9973F"/>

  <!-- REQUIRED PROMINENT PLACEHOLDER TEXT -->
  <text x="300" y="380" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#3B2412" text-anchor="middle" letter-spacing="0.5">Product Image Coming Soon</text>
  <text x="300" y="405" font-family="'DM Sans', 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#8B5A2B" letter-spacing="1.5" text-anchor="middle">AWAITING ORIGINAL PHOTOGRAPHY</text>

  <!-- Product Details Card inside Placeholder -->
  <rect x="45" y="445" width="510" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.8" stroke="#D8A94A" stroke-width="0.9" stroke-opacity="0.5" filter="url(#cardShadow_16)"/>
  <text x="300" y="482" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14.5" font-weight="700" fill="#3B2412" text-anchor="middle">Small Teddy Bear Candle (Pack of 4)</text>
  <text x="300" y="508" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#7A8B6A" letter-spacing="1" text-anchor="middle">FLORAL CANDLES</text>
  
  <rect x="230" y="520" width="140" height="26" rx="13" fill="#FAF6F0" stroke="#D8A94A" stroke-width="0.8"/>
  <text x="300" y="537" font-family="'DM Sans', sans-serif" font-size="12" font-weight="700" fill="#8B5A2B" text-anchor="middle">₹199</text>

  

  <!-- Admin Upload Callout Area -->
  <rect x="65" y="618" width="470" height="60" rx="12" fill="#FAF6F0" fill-opacity="0.9" stroke="#D8A94A" stroke-width="0.9" stroke-dasharray="3,3"/>
  <text x="300" y="642" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="700" fill="#3B2412" text-anchor="middle">Unique Upload Slot: SKU RUH-16-FLO</text>
  <text x="300" y="660" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="500" fill="#8B5A2B" opacity="0.8" text-anchor="middle">Upload high-res photo in Admin Panel to replace placeholder</text>
</svg>