<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <linearGradient id="bgGrad_3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="50%" stop-color="#F5EFE6"/>
      <stop offset="100%" stop-color="#ECE3D4"/>
    </linearGradient>
    <linearGradient id="goldGrad_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D8A94A"/>
      <stop offset="50%" stop-color="#C9973F"/>
      <stop offset="100%" stop-color="#8B5A2B"/>
    </linearGradient>
    <filter id="cardShadow_3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#3B2412" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Clean Warm Cream Background -->
  <rect width="600" height="750" rx="16" fill="url(#bgGrad_3)"/>

  <!-- Minimal Hairline Border -->
  <rect x="18" y="18" width="564" height="714" rx="12" fill="none" stroke="url(#goldGrad_3)" stroke-width="1.2" stroke-opacity="0.4"/>
  <rect x="24" y="24" width="552" height="702" rx="8" fill="none" stroke="#D8A94A" stroke-width="0.7" stroke-opacity="0.2" stroke-dasharray="3,3"/>

  <!-- Architectural Arch Motif Outline -->
  <path d="M 210,95 A 90,90 0 0,1 390,95 L 390,265 L 210,265 Z" fill="#FFFFFF" fill-opacity="0.45" stroke="url(#goldGrad_3)" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Wax Sachet Oval Tablet Motif & Hanging Eyelet Ribbon -->
  <circle cx="300" cy="115" r="7" fill="#FFFFFF" stroke="url(#goldGrad_3)" stroke-width="1.5"/>
  <path d="M 300,108 C 295,80 305,65 300,50" fill="none" stroke="#8B5A2B" stroke-width="2" stroke-linecap="round"/>
  <rect x="250" y="130" width="100" height="120" rx="16" fill="#FFFFFF" stroke="url(#goldGrad_3)" stroke-width="1.2" filter="url(#cardShadow_3)"/>
  <!-- Botanical Flora on Sachet -->
  <circle cx="285" cy="180" r="10" fill="#E9CDB9" fill-opacity="0.6"/>
  <circle cx="315" cy="175" r="12" fill="#C9773B" fill-opacity="0.4"/>
  <circle cx="300" cy="205" r="8" fill="#7A8B6A" fill-opacity="0.5"/>
  <path d="M 300,165 Q 305,190 295,220" fill="none" stroke="#C9773B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <text x="300" y="305" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="11.5" font-weight="700" fill="#8B5A2B" letter-spacing="4" text-anchor="middle">RUHARA CANDLES</text>

  <!-- Divider -->
  <line x1="230" y1="322" x2="370" y2="322" stroke="#D8A94A" stroke-width="0.8" stroke-opacity="0.45"/>
  <circle cx="300" cy="322" r="2.5" fill="#C9973F"/>

  <!-- REQUIRED PROMINENT PLACEHOLDER TEXT -->
  <text x="300" y="380" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="24" font-weight="700" fill="#3B2412" text-anchor="middle" letter-spacing="0.5">Product Image Coming Soon</text>
  <text x="300" y="405" font-family="'DM Sans', 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#8B5A2B" letter-spacing="1.5" text-anchor="middle">AWAITING ORIGINAL PHOTOGRAPHY</text>

  <!-- Product Details Card inside Placeholder -->
  <rect x="45" y="440" width="510" height="230" rx="12" fill="#FFFFFF" fill-opacity="0.85" stroke="#D8A94A" stroke-width="0.8" stroke-opacity="0.35" filter="url(#cardShadow_3)"/>

  <!-- Category Tag -->
  <rect x="230" y="460" width="140" height="24" rx="12" fill="#FAF6F0" stroke="#D8A94A" stroke-width="0.6"/>
  <text x="300" y="476" font-family="'DM Sans', sans-serif" font-size="10" font-weight="700" fill="#8B5A2B" letter-spacing="1.5" text-anchor="middle">WAX SACHETS</text>

  <!-- Product Title -->
  <text x="300" y="520" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="16" font-weight="700" fill="#3B2412" text-anchor="middle" letter-spacing="0.3">Zesty Citrus Blossom & Cinnamon Wardrobe Wax Sachet</text>

  <!-- Divider inside card -->
  <line x1="100" y1="545" x2="500" y2="545" stroke="#ECE3D4" stroke-width="1"/>

  <!-- Specs Grid -->
  <text x="130" y="575" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#8B5A2B" letter-spacing="1">SCENT DURATION</text>
  <text x="130" y="596" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#3B2412">3-6 Months</text>

  <text x="300" y="575" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#8B5A2B" letter-spacing="1" text-anchor="middle">WAX TYPE</text>
  <text x="300" y="596" font-family="'Cinzel', Georgia, serif" font-size="13" font-weight="700" fill="#3B2412" text-anchor="middle">100% Pure Soy</text>

  <text x="470" y="575" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#8B5A2B" letter-spacing="1" text-anchor="end">CRAFT</text>
  <text x="470" y="596" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#3B2412" text-anchor="end">Botanical Cast</text>

  <!-- Authenticity Footer inside Card -->
  <line x1="100" y1="620" x2="500" y2="620" stroke="#ECE3D4" stroke-width="1"/>
  <text x="300" y="645" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#7A8B6A" text-anchor="middle">✦ 100% Hand-Poured Artisanal Botanical Wax Sachet · No Synthetic Paraffin ✦</text>

  <!-- Outer Footer Brand Watermark -->
  <text x="300" y="700" font-family="'DM Sans', sans-serif" font-size="9" font-weight="500" fill="#3B2412" fill-opacity="0.4" letter-spacing="1.5" text-anchor="middle">RUHARA LUXURY ARTISANAL CANDLES · GURUGRAM, INDIA</text>
</svg>